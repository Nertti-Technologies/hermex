# Weekly update PRs for the pinned workflow actions and the NuGet packages. Each PR goes
# through CI and review like any other change; check the licence of any version that changes it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    # Every project is in a subfolder; listed so discovery does not depend on the .slnx file.
    directories: [ "/src/*", "/tests/*", "/samples/*" ]
    schedule:
      interval: "weekly"
    ignore:
      # Pinned per target framework (10.0.x for net10.0, 11.0.x for net11.0); a major
      # update would move a target onto the other framework's line.
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: [ "version-update:semver-major" ]
