name: Release

# Publishes Hermex when a version tag is pushed, e.g.:
#   git tag v2.1.0 && git push origin v2.1.0
#
# On a tag this workflow:
#   1. packs the NuGet package
#   2. publishes it to GitHub Packages   (uses the built-in GITHUB_TOKEN)
#   3. creates a GitHub Release          (uses the built-in GITHUB_TOKEN)
#   4. publishes it to NuGet.org         (Trusted Publishing: GitHub OIDC -> 1-hour key)
#
# It can also be run by hand ("Run workflow") for an existing tag, to finish a release
# whose publish step failed. Every step skips work that is already done, so a re-run is safe.
#
# NuGet.org side: a Trusted Publishing policy for owner Nertti-Technologies, repository
# hermex, workflow file release.yml. Repo side: the NUGET_USER secret holds the nuget.org
# profile name (not an email address). No API key is stored.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v2.0.0'
        required: true

permissions:
  contents: write    # required to create the GitHub Release
  packages: write    # required to publish to GitHub Packages
  id-token: write    # required for NuGet.org Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v2.0.0"; exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # SDK from global.json; the 10.0 runtime is for the net10.0 test run.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/Hermex.Tests/Hermex.Tests.csproj -c Release

      - name: Pack
        run: >
          dotnet pack src/Hermex/Hermex.csproj -c Release -o ./artifacts
          /p:Version=${{ steps.version.outputs.value }}
          /p:ContinuousIntegrationBuild=true

      # --- GitHub-side publishing (always available via GITHUB_TOKEN) ---------

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --no-symbols
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it as is."
          else
            gh release create "$TAG" ./artifacts/*.nupkg \
              --verify-tag --title "Hermex ${{ steps.version.outputs.value }}" --generate-notes
          fi

      # --- NuGet.org publishing (Trusted Publishing, no stored API key) -------

      # Exchanges this job's GitHub OIDC token for a nuget.org key valid for one hour.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
