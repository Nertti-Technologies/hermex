name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CI only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # SDK from global.json; the 10.0 runtime is for the net10.0 test run.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Check the package README
        run: |
          .github/scripts/check-package-readme.sh README.md
          .github/scripts/check-package-readme.sh src/Hermex.Testing/README.md

      - name: Restore
        run: dotnet restore Hermex.slnx

      - name: Build
        run: dotnet build Hermex.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Hermex.Tests/Hermex.Tests.csproj -c Release --no-build --verbosity normal
