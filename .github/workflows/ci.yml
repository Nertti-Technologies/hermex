name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CI only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          # SDK from global.json; the 10.0 runtime is for the net10.0 test run.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hermex.slnx

      - name: Build
        run: dotnet build Hermex.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Hermex.Tests/Hermex.Tests.csproj -c Release --no-build --verbosity normal
